# Two PostgreSQL 18 servers for Portfolio 5: a primary that takes writes,
# and a replica that copies every change from it.
#
#   docker compose up -d         start (the first start builds both)
#   docker compose down -v       stop and delete both data directories
#
# Ports are published on 127.0.0.1 only, so neither server can be reached
# from outside this machine. The password below is for this local
# exercise and protects nothing else.
services:
  primary:
    image: postgres:18-alpine
    container_name: deevas-pg-primary
    environment:
      POSTGRES_PASSWORD: portfolio5
      POSTGRES_DB: deevas_designs
    command: >
      postgres
      -c cluster_name=primary
      -c wal_level=replica
      -c max_wal_senders=5
      -c max_replication_slots=5
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - primary-data:/var/lib/postgresql
      # run once, when the data directory is first created
      - ./init-primary:/docker-entrypoint-initdb.d:ro
      # the Portfolio 1 schema and sample data, loaded by init-primary
      - ../portfolio-1-database-design:/schema:ro
    healthcheck:
      # the server only listens on the network once initialisation is over
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d deevas_designs"]
      interval: 2s
      retries: 60

  replica:
    image: postgres:18-alpine
    container_name: deevas-pg-replica
    depends_on:
      primary:
        condition: service_healthy
    # the copy must belong to the postgres user, so the container runs as it
    user: postgres
    environment:
      POSTGRES_PASSWORD: portfolio5
    entrypoint: ["/bin/sh", "/replica/start-replica.sh"]
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - replica-data:/var/lib/postgresql
      - ./replica:/replica:ro

volumes:
  primary-data:
  replica-data:
